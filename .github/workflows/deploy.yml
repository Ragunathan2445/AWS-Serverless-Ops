name: Serverless Ops CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Lambda Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Python syntax
        run: python -m py_compile lambda_function.py

  deploy:
    name: Deploy Lambda to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check GitHub OIDC environment
        run: |
          echo "Checking GitHub OIDC configuration..."
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "OIDC request variables are available."
          else
            echo "OIDC request variables are missing."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Package Lambda function
        run: zip function.zip lambda_function.py

      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name serverless-ops-processor \
            --zip-file fileb://function.zip

      - name: Verify deployment
        run: |
          aws lambda get-function \
            --function-name serverless-ops-processor \
            --query 'Configuration.[FunctionName,LastModified,State]' \
            --output table
